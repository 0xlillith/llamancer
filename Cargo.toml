[package]
name = "llamancer"
version = "0.1.0-beta.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A lightweight Rust TUI for llama.cpp model and inference management"
repository = "https://github.com/0xlillith/llamancer"
keywords = ["tui", "llama-cpp", "llm", "inference", "oh-my-pi"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
# The default Mio reader spins on PTY EOF; use the bounded Unix poll reader.
crossterm = { version = "0.29", features = ["use-dev-tty"] }


serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"

serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
url = "2"
sha2 = "0.10"

fs2 = "0.4"
libc = "0.2"

signal-hook = "0.3"

# Verified, bounded upstream backend archive extraction.
flate2 = "1"
tar = "0.4"
