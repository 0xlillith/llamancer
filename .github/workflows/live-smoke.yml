name: Live CPU smoke tests

on:
  workflow_dispatch:
    inputs:
      multimodal:
        description: Include pinned SmolVLM CPU vision fixtures
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned CPU server using Llamancer and fetch GGUF fixture
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/managed-data"
          mkdir -p "$RUNNER_TEMP/models"
          cargo build --locked --release
          target/release/llamancer backend list
          server="$(target/release/llamancer backend install cpu)"
          test -x "$server"
          target/release/llamancer backend probe cpu
          model="$RUNNER_TEMP/models/stories260K.gguf"
          curl --fail --location --retry 3 --max-time 120 https://huggingface.co/ggml-org/tiny-llamas/resolve/99dd1a73db5a37100bd4ae633f4cfce6560e1567/stories260K.gguf -o "$model"
          printf '%s  %s\n' 047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b "$model" | sha256sum -c -
          printf 'XDG_DATA_HOME=%s\nLLAMANCER_TEST_SERVER=%s\nLLAMANCER_TEST_MODELS=%s\n' "$XDG_DATA_HOME" "$server" "$RUNNER_TEMP/models" >> "$GITHUB_ENV"
      - name: Test actual inference and service lifecycle
        run: cargo test --locked --test llama_live real_cpu_router_lifecycle -- --ignored --nocapture
      - name: Exercise desktop backend harness on CPU
        env:
          LLAMANCER_TEST_DEVICE: none
          LLAMANCER_TEST_GPU_LAYERS: "0"
        run: |
          LLAMANCER_TEST_MODEL="$LLAMANCER_TEST_MODELS/stories260K.gguf" cargo test --locked --test desktop_live -- --ignored --nocapture
      - name: Test actual Hub download and resume
        run: cargo test --locked --test hub_live download_and_index_real_gguf -- --ignored --nocapture

      - name: Fetch pinned multimodal fixtures
        if: inputs.multimodal
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vision"
          mkdir -p "$root"
          base="https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/b9e4379657e1450d04d02eec8e345667265b0a00"
          model="SmolVLM-256M-Instruct-Q8_0.gguf"
          projector="mmproj-SmolVLM-256M-Instruct-Q8_0.gguf"
          curl --fail --location --retry 3 --max-time 180 "$base/$model" -o "$root/$model"
          curl --fail --location --retry 3 --max-time 180 "$base/$projector" -o "$root/$projector"
          printf '%s  %s\n' 2a31195d3769c0b0fd0a4906201666108834848db768af11de1d2cef7cd35e65 "$root/$model" | sha256sum -c -
          printf '%s  %s\n' 7e943f7c53f0382a6fc41b6ee0c2def63ba4fded9ab8ed039cc9e2ab905e0edd "$root/$projector" | sha256sum -c -
          printf 'LLAMANCER_TEST_VISION_MODELS=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Test actual multimodal single and router inference
        if: inputs.multimodal
        run: cargo test --locked --test llama_live real_cpu_multimodal -- --ignored --nocapture
