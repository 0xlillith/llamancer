name: Dependency audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
      - tests/license_inventory.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inventory dependency licenses
        run: python3 tests/license_inventory.py > licenses.json
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Scan locked dependencies
        run: cargo audit --json > audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: |
            licenses.json
            audit.json
